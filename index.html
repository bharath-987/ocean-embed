<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>KYOGRE // NEUROTIDE — Seeing Beneath the Surface | SIH26066</title>
  <meta name="description" content="AI-powered reconstruction of subsurface ocean temperature from satellite observations alone. SIH26066 - Team NeuroTide." />

  <!-- Google Fonts: Space Grotesk, Inter, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&family=JetBrains+Mono:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "background": "#02060d",
            "surface": "#060d1a",
            "primary": "#dbfcff",
            "primary-container": "#00f0ff",
            "surface-tint": "#00dbe9",
            "surface-container": "#0a1324",
            "surface-container-high": "#111f38",
            "surface-container-lowest": "#010409",
            "on-surface": "#dde2f3",
            "on-surface-variant": "#94a9be",
            "outline": "#48627e",
            "outline-variant": "#1c2d47",
            "error": "#ffb4ab"
          },
          fontFamily: {
            "display": ["'Space Grotesk'", "sans-serif"],
            "body": ["Inter", "sans-serif"],
            "mono": ["'JetBrains Mono'", "monospace"]
          }
        }
      }
    };
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: auto !important; background: #02060d; color: #dde2f3; }
    body { font-family: 'Inter', sans-serif; overflow-x: hidden; background: #02060d; }

    /* Clean glow effects conforming to Abyssal Precision design */
    .cyan-halo {
      text-shadow: 0 0 40px rgba(0, 240, 255, 0.45);
    }
    .glass-hairline {
      background: rgba(4, 10, 22, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 240, 255, 0.12);
    }
  </style>

  <!-- External Libraries: React 18, GSAP 3, Lenis 1.1.14 -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/lenis@1.1.14/dist/lenis.min.js"></script>
</head>
<body class="bg-[#02060d] text-[#dde2f3] antialiased selection:bg-[#00f0ff] selection:text-[#02060d] relative overflow-x-hidden">
  <!-- React Mount Point -->
  <div id="root"></div>

  <!-- Compiled React/TypeScript Application Bundle -->
  <script src="dist/kyogre-app.js"></script>
</body>
</html>
